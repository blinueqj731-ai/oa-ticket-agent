server:
  port: 8080

spring:
  application:
    name: oa-ticket-agent

  datasource:
    # 相对路径，数据库文件会生成在项目根目录
    url: jdbc:sqlite:oa-ticket.db
    driver-class-name: org.sqlite.JDBC

  sql:
    init:
      # SQLite 不被 Spring Boot 当作内嵌数据库，默认不会执行初始化脚本，
      # 所以这里必须显式设成 always
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      # Windows 下不指定编码容易把中文读成乱码
      encoding: UTF-8
      continue-on-error: false

logging:
  level:
    com.example.oaticket: DEBUG

llm:
  # 密钥只从环境变量读，不写进配置文件
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model: ${BAILIAN_MODEL:deepseek-v4.1-flash}
  timeout-seconds: 60

agent:
  # 模型最多来回几轮，超了就降级转人工
  max-steps: 6
  # 单次请求的墙钟上限，按实测最坏延迟（12 秒）乘以预计步数留的余量
  timeout-seconds: 60
  # 单次处理的 token 上限，实测 3 步工单约 3200 token
  token-budget: 8000

embedding:
  # 百炼的向量模型，和对话模型共用同一个 apiKey 与 base-url
  model: text-embedding-v3
  # 检索返回几条，3 条够用：多了会稀释模型的注意力
  top-k: 3
  # 相似度低于此值直接丢弃，宁可不给也不要给不相关的
  # 0.6 是在 20 条工单上实测出来的：相关查询的 top3 落在 0.65~0.84，
  # 无关查询最高只到 0.51（"今天食堂吃什么"能召回到病假单），0.6 正好卡在两者之间
  min-score: 0.6
